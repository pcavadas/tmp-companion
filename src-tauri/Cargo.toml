[package]
name = "tmp-companion"
version = "0.0.0-development"
description = "USB controller for the Fender Tone Master Pro: loudness leveling, block copy, and song/setlist editing"
authors = ["Pedro CAVADAS"]
# Edition 2024 is its own change (`cargo fix --edition`, then the unsafe-op lints it
# brings), kept out of the hygiene pass that set the floor and lints below (#281).
edition = "2021"
# The floor is set by the dependencies, not by this crate: tauri 2's crates (and its
# plugins) declare 1.90. CI builds on `stable`.
rust-version = "1.90"
# probe/gen_samples are dev-only helper bins; `tauri dev` runs a bare `cargo run`
# which is otherwise ambiguous with multiple binaries.
default-run = "tmp-companion"

[lib]
name = "tmp_companion_lib"
# Desktop only: the app and the dev bins link the rlib. The Tauri mobile template's
# `staticlib`/`cdylib` were never used and cost a link each per build (#281).
crate-type = ["rlib"]

# The lint policy CI enforces (`cargo clippy --all-targets -- -D warnings`), so a plain
# `cargo clippy` or `cargo build` holds a contributor to the same bar (#281). It covers
# clippy's warnings too.
[lints.rust]
warnings = "deny"

# The shipped binary: whole-crate optimisation. Symbols are KEPT (`strip = "debuginfo"`,
# not "symbols") so a panic backtrace in a user's log still names its frames. No
# `panic = "abort"`: the monitor's `catch_unwind`, the drop guards (`MonitorPauseGuard`,
# `LiveLufsGuard`, `ReampRunGuard`) and `lock_ok`'s poison recovery all rely on unwinding.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Dev and test builds: light optimisation. The SimDevice-driven tests (`e2e_server_tests.rs`,
# serialized on one lock) spend their time in the capture/LUFS DSP, which unoptimised code runs
# ~25x slower: `cargo test --lib --features e2e` took 442 s at opt-level 0 and 23 s at 1, warm
# rebuilds unchanged (~7 s). Debug assertions and overflow checks stay on.
[profile.dev]
opt-level = 1

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Property tests for the decoders that take device or file bytes (`proto`, `backup`,
# `backup_read`). `std` only: the default `fork`/`timeout` features add a subprocess
# runner the in-process properties don't need.
[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Closed-loop progress + cross-thread command/response to the HID runloop thread.
crossbeam-channel = "0.5"
# Re-amp playback + capture of the processed return. cpal IS native CoreAudio
# (AUHAL) on macOS — same backend the emulator uses.
cpal = "0.18"
# Pure-Rust EBU R128 / ITU-R BS.1770 loudness measurement (no C dependency).
ebur128 = "0.1"
# WAV decode for sound samples + capture dumps.
hound = "3"
# Logging: tauri-plugin-log writes frontend (console/error) + backend `log::*`
# records to the OS log dir + stdout. `log` provides the macros + LevelFilter.
tauri-plugin-log = "2"
log = "0.4"
# In-app auto-update: checks the GitHub `latest.json` endpoint, downloads +
# verifies the signed `.app.tar.gz`, and (process plugin) relaunches to apply.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Device-backup fast DB read (`probe --device-backup`): the unit streams a
# GNU-tar + LZ4-frame archive of /data (built by `tm-stomp-server`'s libarchive).
# Both pure-Rust, no C dependency.
lz4_flex = "0.14"
tar = "0.4"
# The backup's `normalDb.db3` is queried in-process. `bundled` compiles SQLite from the
# vendored amalgamation so no platform needs a `sqlite3` CLI on PATH (Windows ships none).
rusqlite = { version = "0.40", features = ["bundled"] }
realfft = "3.5.0"
# SHA-256 for the trace recorder's stimulus, argument and field-8 hashes (`trace/`).
sha2 = "0.11"

# macOS-only: IOKit HID (exclusive device seize) is
# reached by hand-declared `#[link(name = "IOKit", kind = "framework")]` externs
# in hid.rs — no Rust crate exposes kIOHIDOptionsTypeSeizeDevice. core-foundation-sys
# gives us the raw CFType/CFRunLoop bindings hid.rs and watcher.rs call.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

# Linux-only: the TMP is reached through hidraw (`/dev/hidraw*`), found by walking
# sysfs — no udev crate, no C hidapi. libc supplies open/read/write/poll/close/flock.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Windows-only: the TMP is reached through the Win32 HID stack (SetupAPI enumeration
# + `CreateFileW` with exclusive share mode — the seize — + overlapped `ReadFile`/
# `WriteFile`). `windows-sys` is the thin extern binding tauri/cpal already pull; only
# the feature set widens.
[target.'cfg(windows)'.dependencies]
# COM endpoint-volume control (`audio::endpoint_volume`): shared-mode WASAPI
# scales the app's inject/capture by the endpoint's Windows master volume, so
# re-amp must force the TMP's endpoints to unity. Same crate family the tree
# already pulls via tao/cpal.
windows = { version = "0.62", features = [
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol", "dev-bins"]
custom-protocol = ["tauri/custom-protocol"]
# Offline UI e2e seam: compiles the device-transport factory (`session::e2e_transport`)
# and the `e2e_server` bin so a Playwright run drives the real backend against an
# in-memory `SimDevice` instead of USB. Production never enables it (real `Hid` only).
# `tauri/test` gives the windowless MockRuntime the server invokes commands through.
e2e = ["tauri/test"]
# Gates the dev-only helper bins (probe/gen_samples) OUT of the release bundle.
# It's in `default`, so plain `cargo build/run/clippy` keep building them — but
# tauri-cli checks a bin's required-features against the EXPLICIT --features flags
# only (never cargo defaults), and scripts/release-build.sh passes none, so the
# universal bundler skips them (they're never lipo'd into the universal dir).
# Ceiling: if a future tauri-cli resolves default features here, the fix recurs as
# the SAME loud "does not exist" bundling error at release time — never silent.
dev-bins = []

# The three helper bins are dev/test-only and must NOT ship in the signed release
# bundle. Auto-discovery would bundle every src/bin/*.rs into the .app; the
# required-features gate (see `dev-bins`/`e2e` above) makes the release bundler
# skip them while `name` == file stem keeps each block merged with its inferred
# target (main `tmp-companion` stays auto-discovered from src/main.rs).
[[bin]]
name = "probe"
path = "src/bin/probe.rs"
required-features = ["dev-bins"]

[[bin]]
name = "gen_samples"
path = "src/bin/gen_samples.rs"
required-features = ["dev-bins"]

[[bin]]
name = "e2e_server"
path = "src/bin/e2e_server.rs"
required-features = ["e2e"]
