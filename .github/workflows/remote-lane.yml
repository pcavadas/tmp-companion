name: remote-lane

# Runs the remote e2e lane (scripts/e2e-remote.sh) for a pull request that touches
# device-facing code, on a remote device that lives outside this repository. This job only
# decides and dispatches: it reads which online specs the diff requires from the gate
# policy (`gates.sh --required-online`, the same mapping the release run uses), and either
# posts a passing `remote-lane` status at once ("not needed") or asks the runner named by the
# TWIN_LANE_REPO variable (on the TWIN_LANE_REF branch, if set) to run exactly those specs on
# the PR's head commit. That run posts the final `remote-lane` status back on the same commit.
#
# `remote-lane` is a REQUIRED check on main, so every PR from this repository must end with
# one: "not needed", the lane's own verdict, or `error` (a missing TWIN_LANE_TOKEN or
# TWIN_LANE_REPO is named in the description, never skipped silently). Same-repository PRs
# only: a fork's PR never gets the dispatch token (and pull_request_target is never used
# here), so outside code never reaches the remote device on its own, and the PR waits until
# a maintainer has read it and dispatches the lane for its head commit by hand
# (`twin-lane.yml` with companion_ref=<head SHA>, specs=<this job's selection>, pr=<number>);
# a fork PR with no device-facing change gets "not needed" from the `fork` job below.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Fork PRs only (the `fork` job): their pull_request token cannot post a status.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: remote-lane-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Online specs this PR requires
        id: specs
        run: |
          git fetch -q origin "$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          req=$(bash scripts/gates.sh --required-online --since "$base" | tr '\n' ' ' | sed 's/ *$//')
          # ANY: any one online spec covers the change; songs is the shortest.
          [ "$req" = ANY ] && req=songs
          echo "required: ${req:-none}"
          echo "specs=$req" >> "$GITHUB_OUTPUT"

      - name: Not needed
        if: steps.specs.outputs.specs == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=remote-lane \
            -f description="not needed: no device-facing change" >/dev/null

      - name: Dispatch the remote lane
        if: steps.specs.outputs.specs != ''
        env:
          GH_TOKEN: ${{ secrets.TWIN_LANE_TOKEN }}
          STATUS_TOKEN: ${{ github.token }}
          LANE_REPO: ${{ vars.TWIN_LANE_REPO }}
          LANE_REF: ${{ vars.TWIN_LANE_REF }}
          SPECS: ${{ steps.specs.outputs.specs }}
        run: |
          # Statuses go through this repository's own token, so a missing dispatch token can
          # still be reported on the PR instead of leaving the required check absent.
          status() { GH_TOKEN="$STATUS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$1" -f context=remote-lane -f description="$2" >/dev/null; }
          missing=""
          [ -n "$GH_TOKEN" ] || missing="the TWIN_LANE_TOKEN secret (unset or empty)"
          [ -n "$LANE_REPO" ] || missing="${missing:+$missing and }the TWIN_LANE_REPO variable"
          if [ -n "$missing" ]; then
            echo "::error::remote lane not configured: $missing"
            status error "not configured: $missing"
            exit 1
          fi
          # Pending first, so it can never land after the final status the run posts.
          status pending "running: $SPECS"
          # TWIN_LANE_REF picks the runner's branch; unset, its default branch.
          if ! gh workflow run twin-lane.yml --repo "$LANE_REPO" ${LANE_REF:+--ref "$LANE_REF"} \
            -f companion_ref="$SHA" -f specs="$SPECS" -f pr="$PR"; then
            status error "could not dispatch the remote lane"
            exit 1
          fi
          echo "dispatched: $SPECS for $SHA"

  # A fork PR still needs a `remote-lane` status, or the required check never resolves. This
  # job runs in the base repository's context (pull_request_target) and never fetches or runs
  # the fork's code: it checks out the BASE commit, reads the PR's changed-file NAMES from the
  # API, and classifies them with the base's own gates.sh and gate map. No device-facing file
  # posts "not needed"; otherwise the status stays pending until a maintainer has read the PR
  # and dispatches the lane by hand. It never dispatches, and never sees TWIN_LANE_TOKEN.
  fork:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Classify the fork's changed files (names only, base scripts)
        run: |
          # Renames count under both names: moving a device file away is device-facing too.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          req=$(TMP_GATES_CHANGED_FILES="$files" bash scripts/gates.sh --required-online \
            | tr '\n' ' ' | sed 's/ *$//')
          [ "$req" = ANY ] && req=songs
          echo "required: ${req:-none}"
          if [ -z "$req" ]; then
            state=success desc="not needed: no device-facing change"
          else
            state=pending desc="fork PR: a maintainer must dispatch the remote lane ($req)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=remote-lane \
            -f description="${desc:0:140}" >/dev/null
