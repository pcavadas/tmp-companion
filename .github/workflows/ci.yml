name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # macOS is the shipping platform (IOKit HID + CoreAudio re-amp). Linux and
    # Windows run the same gates to hold the platform boundary: everything above the
    # `HidTransport` seam must stay portable, and a stray `target_os` assumption
    # elsewhere in the crate should fail HERE rather than during a port. `fail-fast:
    # false` so one platform's failure never hides another's result.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev
        # webkit2gtk/xdo/appindicator/rsvg are Tauri's Linux webview stack; asound is
        # for cpal, which is an unconditional dependency and must compile even though
        # the re-amp paths are macOS-only today.

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (also produces dist/ for tauri-build)
        run: bun run build

      # Every gate runs on both legs. The frontend ones are mostly platform-agnostic,
      # but the typecheck and build are not: Linux filesystems are case-sensitive
      # where macOS is not, so a wrong-case import (`./Foo` for `foo.ts`) passes on
      # macOS and fails only here. Keeping the leg uniform costs little (the Vitest
      # suite is ~20 s) and leaves nothing to explain about why a step is skipped.
      - name: Lint
        run: bun run lint

      - name: Format check (prettier)
        run: bun run format:check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Frontend tests
        run: bun run test

      - name: Rust tests
        # Explicit bash uses fail-fast native-command handling on Windows too.
        shell: bash
        working-directory: src-tauri
        # Two lanes, for the same reason clippy runs two: a guard whose branch only
        # compiles under `e2e` is never executed by the default-feature run. The
        # settle-collapse guard (`device_gate::settles_are_full_length_…`) is exactly
        # that — without the second lane a regression that zeroed hardware settles
        # would pass here and stay green in the offline suite too.
        run: |
          cargo test --lib
          cargo test --lib --features e2e

      - name: Rust clippy
        shell: bash
        working-directory: src-tauri
        # Two lanes: default features, then the e2e feature. The e2e lane is
        # required because sim_device (+ e2e_server) only compile under
        # `feature = "e2e"`, so default-features clippy never sees their dead
        # code. Keep both — the default lane still guards default-only paths.
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features e2e -- -D warnings

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

  e2e:
    # The offline suite needs no device — it drives the real UI in headless Chromium
    # through the HTTP bridge into a windowless Rust backend against SimDevice. That
    # makes it the strongest cross-platform signal available: it exercises the whole
    # command surface, so a backend path that only compiles (but does not RUN) off
    # macOS fails here rather than in someone's port.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # --with-deps pulls Chromium's shared libraries on Linux; it is a no-op-ish
      # extra on macOS, so the flag is scoped rather than applied to both.
      - name: Install Playwright Chromium
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            bunx playwright install --with-deps chromium
          else
            bunx playwright install chromium
          fi

      # Linux runners are CPU-constrained enough that the default 3-worker offline
      # suite intermittently blows level-fs-preset24's 240 s test timeout (reproduced
      # on GitHub's own ubuntu-latest hardware, not just underpowered local boxes);
      # macos-14 has no such issue at the default worker count. Serializing on Linux
      # trades CI minutes for reliability rather than touching the shared spec/config.
      #
      # The non-Linux branch is deliberately EMPTY, not "3": `bun run e2e` is
      # scripts/e2e.sh, whose `WORKERS="${TMP_E2E_WORKERS:-3}"` substitutes on empty as
      # well as unset and re-exports the resolved value before Playwright ever starts.
      # So empty means "take e2e.sh's default" and there is exactly one place that
      # default lives; hardcoding 3 here would let macOS CI silently diverge from a
      # local run if it ever changed.
      - name: Offline e2e (SimDevice)
        run: bun run e2e
        env:
          TMP_E2E_WORKERS: ${{ runner.os == 'Linux' && '1' || '' }}

  bundle-linux:
    # Load-bearing, not just nice-to-have: release.yml's Linux build jobs run
    # continue-on-error so a broken bundler config never blocks the signed macOS
    # DMG — which also means it produces a green RELEASE with a silently missing
    # Linux asset. This job is what catches that on the PR instead of at release
    # time. See notes/linux-packaging.md for the full pipeline rationale; keep
    # this job's steps in sync with release.yml's build-deb/build-rpm (same
    # bundler invocation, with temporary versions and artifacts for repository upgrade tests).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: deb
            os: ubuntu-22.04
            container: ""
          - target: rpm
            os: ubuntu-latest
            # See release.yml's build-rpm for why the rpm builds in a Fedora
            # container rather than on Ubuntu, and why it is pinned by digest
            # rather than by the mutable `fedora:43` tag. Keep this digest in
            # sync with release.yml's, so the gate and the release agree.
            container: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42 # fedora:43
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    steps:
      - name: Install Fedora build dependencies
        if: matrix.target == 'rpm'
        run: |
          # findutils: the payload check greps the installed tree with
          # `find -printf`, and the minimal Fedora image does not ship it.
          dnf install -y git nodejs gcc gcc-c++ make pkgconf-pkg-config \
            webkit2gtk4.1-devel openssl-devel librsvg2-devel libxdo-devel \
            libappindicator-gtk3-devel alsa-lib-devel findutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: linux-${{ matrix.target }}

      - name: Install Ubuntu system dependencies
        if: matrix.target == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (also produces dist/ for tauri-build)
        run: bun run build

      - name: Set the baseline repository-test version
        run: node scripts/bump-version.mjs 0.0.1

      - name: Build the .${{ matrix.target }} bundle
        run: bun run tauri build --bundles ${{ matrix.target }}

      # Building the package proves the bundler config parses; it proves nothing
      # about what the package DOES. Installing it is what exercises the udev
      # rule's path, the postinst/postrm hooks and the `depends` names — and it
      # is the only thing that catches a wrong hicolor icon DIRECTORY, which is
      # invisible to a build: the file is present and correct, just filed where
      # no icon theme will look for it.
      - name: Install the .deb, check its payload, remove it
        if: matrix.target == 'deb'
        run: |
          set -euo pipefail
          deb=$(readlink -f "$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)")
          name=$(dpkg-deb -f "$deb" Package)
          echo "installing $name from $deb"
          # `apt-get install ./file.deb` resolves `depends` (sqlite3, libasound2)
          # rather than leaving the package half-configured the way `dpkg -i` does.
          sudo apt-get install -y "$deb"
          bash .github/scripts/check-linux-payload.sh
          # Removal must be clean too: postrm reloads udev, and a non-zero exit
          # there would leave the package half-removed.
          sudo apt-get remove -y "$name"
          test ! -e /usr/lib/udev/rules.d/70-fender-tone-master-pro.rules
          echo "removed cleanly; udev rule gone"

      - name: Install the .rpm, check its payload, remove it
        if: matrix.target == 'rpm'
        run: |
          set -euo pipefail
          rpm=$(readlink -f "$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | head -1)")
          name=$(rpm -qp --qf '%{NAME}' "$rpm")
          echo "installing $name from $rpm"
          dnf install -y "$rpm"
          bash .github/scripts/check-linux-payload.sh
          dnf remove -y "$name"
          test ! -e /usr/lib/udev/rules.d/70-fender-tone-master-pro.rules
          echo "removed cleanly; udev rule gone"

      - name: Stage the first real bundle for repository validation
        env:
          FORMAT: ${{ matrix.target }}
        run: |
          mkdir -p repo-test-artifacts/v1
          cp src-tauri/target/release/bundle/"$FORMAT"/*."$FORMAT" repo-test-artifacts/v1/

      - name: Build a higher version for the repository upgrade test
        env:
          FORMAT: ${{ matrix.target }}
        run: |
          node scripts/bump-version.mjs 0.0.2
          rm -f src-tauri/target/release/bundle/"$FORMAT"/*."$FORMAT"
          bun run tauri build --bundles "$FORMAT"
          mkdir -p repo-test-artifacts/v2
          cp src-tauri/target/release/bundle/"$FORMAT"/*."$FORMAT" repo-test-artifacts/v2/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.target }}
          path: repo-test-artifacts
          retention-days: 1
          if-no-files-found: error

  validate-linux-repos:
    needs: bundle-linux
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: apt
            os: ubuntu-22.04
            container: ""
          - format: rpm
            os: ubuntu-latest
            container: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42 # fedora:43
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    steps:
      - name: Install Fedora publication tools
        if: matrix.format == 'rpm'
        run: dnf install -y git gh gnupg2 createrepo_c python3 findutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Ubuntu publication tools
        if: matrix.format == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c gnupg rpm

      - name: Verify artifact discovery against this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/select-linux-artifacts.sh > discovered-artifacts
          grep -qx 'deb=true' discovered-artifacts
          grep -qx 'rpm=true' discovered-artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          path: repo-artifacts

      - name: Test publication, signatures and native package upgrades
        env:
          FORMAT: ${{ matrix.format }}
        run: python3 .github/scripts/test-linux-repos.py "$FORMAT" repo-artifacts

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  leak-guard:
    # Belt-and-braces for the pre-commit hook: block private firmware-emulator
    # content in tracked files. Pure grep — no macOS/HID/bun needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files for private-project markers
        run: bash scripts/leak-guard.sh --all
