name: release

# Manual only: releases are batched and started by hand from the Actions tab
# (release → Run workflow, on `main`). There is deliberately no `push:` trigger:
# every merge used to queue a run that waited on the `release` environment's
# approval, and each newer run cancelled the one before it.
on:
  workflow_dispatch:

# Serialize releases: two manual dispatches could overlap, racing
# semantic-release on release creation. Queue instead of cancel so an in-flight
# signing/notarization is never aborted mid-run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Keep husky's git hooks OFF every job here: `bun install` (prepare → husky) wires
# .husky/pre-push into the checkout, so semantic-release's `git push --tags`
# re-ran the LOCAL gate suite here and died — every tag push failed since the
# hook landed (#84). ci.yml on the PR is the authoritative gate; HUSKY=0 makes
# the prepare install a no-op so pushes from this job stay hook-free.
env:
  HUSKY: "0"

jobs:
  # Resolves the version the CURRENT commit set would release, ahead of the real
  # semantic-release run, so the Linux build jobs (which need to bump
  # tauri.conf.json before building) know what to bump to. `semantic-release
  # --dry-run` always exits 0 whether or not a release is due — it fails only on
  # a genuine crash — so a nonzero exit here is treated as a real error, and "no
  # release due" is read from the ABSENCE of the "next release version is …" log
  # line rather than from the exit code.
  #
  # `contents: write` even though this job writes NOTHING: semantic-release runs
  # verifyAuth (`git push --dry-run … HEAD:main`) unconditionally, BEFORE its
  # dry-run branch, so a read-only GITHUB_TOKEN gets a 403 and the whole run dies
  # with EGITNOPERMISSION — which is exactly what happened on the first real run
  # of this job (#173). Dry-run still skips tag creation, the real push and every
  # publish plugin, so the elevated token is only ever spent on that dry-run push
  # probe and the GitHub plugin's read-only permission check.
  resolve-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # PRs run the offline gates only; the online suite runs before a release, on the
      # unit, through scripts/pre-release.sh. This lists the same report on the run's
      # summary: every merged change since the last tag that touched device-facing code.
      - name: List device-facing changes since the last release
        run: |
          {
            echo '## Device-facing changes since the last release'
            echo
            echo '```'
            # Only a missing tag falls back; any other failure fails the step.
            if bash scripts/gates.sh --release-base >/dev/null; then
              bash scripts/gates.sh --device-changes
            else
              echo '(report unavailable: no release tag behind HEAD)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve next release version (dry run)
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$(bunx semantic-release --dry-run 2>&1)" || { echo "$OUT"; exit 1; }
          echo "$OUT"
          VERSION="$(printf '%s\n' "$OUT" | grep -oE 'next release version is [0-9][0-9A-Za-z.+-]*' | awk '{print $NF}' | tail -n1)"
          echo "resolve-version: next version = ${VERSION:-<none — nothing releasable>}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Alpha Linux artifact, built in the same run as the macOS release but never
  # blocking it (continue-on-error): a broken Linux bundle should cost this run
  # its Linux asset, not the signed/notarized macOS DMG. See
  # notes/linux-packaging.md for the full pipeline rationale.
  build-deb:
    needs: resolve-version
    if: needs.resolve-version.outputs.version != ''
    continue-on-error: true
    runs-on: ubuntu-22.04 # oldest still-offered Ubuntu image → lowest glibc floor
    timeout-minutes: 30
    env:
      # Routed through env rather than inline `${{ }}` in run: even though this
      # value is already regex-constrained to [0-9A-Za-z.+-] by resolve-version's
      # own extraction — no reason to interpolate a workflow expression directly
      # into a shell command when a plain env var does the same job.
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: linux-deb

      - name: Install Linux system dependencies
        # Same list as ci.yml's build-test job — Tauri's Linux webview stack + asound
        # for cpal.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump version
        run: node scripts/bump-version.mjs "$VERSION"

      - name: Build frontend (also produces dist/ for tauri-build)
        run: bun run build

      - name: Build the .deb bundle
        # tauri.linux.conf.json auto-merges (Tauri picks it up by platform on a
        # Linux host) — no --config/--bundles flag needed beyond selecting deb here
        # so this job doesn't also attempt the rpm target.
        run: bun run tauri build --bundles deb

      - name: Stage the bundle for the release job
        run: |
          set -euo pipefail
          mkdir -p release-linux
          cp src-tauri/target/release/bundle/deb/*.deb release-linux/
          printf '%s' "$VERSION" > release-linux/version.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb
          path: release-linux
          retention-days: 1
          if-no-files-found: error

  build-rpm:
    needs: resolve-version
    if: needs.resolve-version.outputs.version != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    # GitHub offers no Fedora RUNNER, but a container on an Ubuntu host gives a
    # genuine Fedora build: the binary links Fedora's libraries and the rpm's
    # `depends` names (sqlite, alsa-lib, webkit2gtk4.1, …) resolve natively there,
    # instead of an Ubuntu-linked binary carrying hand-written Fedora dependency
    # names with no compiler/linker to catch a mismatch. fedora:43 is the oldest
    # still-supported Fedora release as of this writing (Fedora 42 reached EOL in
    # May 2026) — bump this alongside Fedora's own release cadence.
    #
    # Pinned by DIGEST, not by the `fedora:43` tag: this job's output is a
    # PUBLISHED release artifact, and a mutable tag lets the image under it change
    # with no commit in this repo. Same digest in ci.yml's bundle-linux job, so the
    # PR gate and the release build the rpm against the identical base.
    container:
      image: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42 # fedora:43
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      # A bare fedora image has none of this. Installed BEFORE actions/checkout
      # (which needs git) and before any JS-based action needing a working shell.
      # nodejs is required explicitly here — unlike the hosted ubuntu-22.04 runner
      # image build-deb uses, this container has no Node.js preinstalled, and
      # scripts/bump-version.mjs needs `node` on PATH.
      - name: Install Fedora build dependencies
        run: |
          dnf install -y git nodejs gcc gcc-c++ make pkgconf-pkg-config \
            webkit2gtk4.1-devel openssl-devel librsvg2-devel libxdo-devel \
            libappindicator-gtk3-devel alsa-lib-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: linux-rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump version
        run: node scripts/bump-version.mjs "$VERSION"

      - name: Build frontend (also produces dist/ for tauri-build)
        run: bun run build

      - name: Build the .rpm bundle
        # Tauri's rpm bundler is the pure-Rust `rpm` crate — no `rpmbuild` needed.
        run: bun run tauri build --bundles rpm

      - name: Stage the bundle for the release job
        run: |
          set -euo pipefail
          mkdir -p release-linux
          cp src-tauri/target/release/bundle/rpm/*.rpm release-linux/
          printf '%s' "$VERSION" > release-linux/version.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-rpm
          path: release-linux
          retention-days: 1
          if-no-files-found: error

  # Alpha Windows artifact, built in the same run as the macOS release but never
  # blocking it (continue-on-error) — the same contract as build-deb/build-rpm.
  # The setup.exe is UNSIGNED (no Windows code-signing certificate — SmartScreen
  # warns on first launch) and has no updater feed (tauri.windows.conf.json turns
  # updater artifacts off), so it publishes as a plain release asset only.
  build-nsis:
    needs: resolve-version
    if: needs.resolve-version.outputs.version != ''
    continue-on-error: true
    runs-on: windows-latest
    # Fresh-cache MSVC builds of the full tauri tree run 15-25 min on the hosted
    # runner; rust-cache (key: windows-nsis) brings repeats down to a few. 40 min
    # leaves headroom over the Linux jobs' 30 without inheriting the 360-min default.
    timeout-minutes: 40
    env:
      # Routed through env rather than inline `${{ }}` in run: — same rationale
      # as build-deb (the value is already regex-constrained by resolve-version's
      # own extraction; a plain env var beats interpolating a workflow expression
      # into a shell command).
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: windows-nsis

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # shell: bash on every step that expands $VERSION or globs paths: the
      # windows-latest default shell is pwsh, where "$VERSION" is NOT the env var.
      # Git Bash ships with the runner image — same fail-fast choice ci.yml makes
      # for its Windows cargo steps.
      - name: Bump version
        shell: bash
        run: node scripts/bump-version.mjs "$VERSION"

      - name: Build frontend (also produces dist/ for tauri-build)
        run: bun run build

      - name: Build the NSIS installer
        # tauri.windows.conf.json auto-merges on a Windows host (Tauri picks it up
        # by platform): it selects the NSIS bundler and disables updater artifacts,
        # so no TAURI_SIGNING_PRIVATE_KEY is needed here. The --bundles flag is
        # explicit for parity with the deb/rpm legs. bash because package.json's
        # `tauri` script wraps a bash script.
        shell: bash
        run: bun run tauri build --bundles nsis

      - name: Stage the bundle for the publish job
        # Exactly-one guard: a second, stale setup.exe in the bundle dir (restored
        # target cache, reused runner) would make a bare-glob cp copy two files
        # onto one FILE target and fail — hidden by continue-on-error. Fixed
        # target name so the publish job's asset name never depends on the
        # version string embedded in the NSIS output filename.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          [ "${#exes[@]}" -eq 1 ] || { echo "expected 1 setup.exe, found ${#exes[@]}" >&2; exit 1; }
          mkdir -p release-windows
          cp "${exes[0]}" release-windows/TMP-Companion-windows-alpha-x64-setup.exe
          printf '%s' "$VERSION" > release-windows/version.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-nsis
          path: release-windows
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [resolve-version, build-deb, build-rpm]
    # Runs whether the Linux jobs succeeded, failed (continue-on-error), or were
    # skipped (nothing releasable) — this job's own behavior is unchanged from
    # before the Linux jobs existed either way. Only a cancelled run, or a genuine
    # resolve-version failure (as opposed to "nothing to release"), skips it.
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: macos-14 # macOS-only crate; ARM host cross-builds the universal (arm64+x86_64) binary
    environment: release # gates the Apple signing/notarization secrets to this env
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Backstop a hung `notarytool --wait`: without this the job inherits the 360-min
    # default and can burn ~6h on the 10×-cost macOS runner. A normal run is ~7 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate the release: a broken build/test must not cut a signed, notarized
      # DMG. These run before semantic-release, so a failure aborts the release.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Frontend tests
        run: bun run test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # Never blocks: a missing/failed Linux build (skipped job, or the download
      # itself finding no artifact) just means release-build.sh finds no
      # release-linux/ to stage, and .releaserc.json's Linux asset globs match
      # nothing — @semantic-release/github logs that per-asset and continues, it
      # does not fail the release.
      - name: Download Linux build artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          path: release-linux
          merge-multiple: true


      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — Tauri imports the cert into a temp keychain and signs
          # with hardened runtime when these are set.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization — Tauri notarizes + staples the .app before building the dmg.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signing — Tauri signs the .app.tar.gz with this minisign key so
          # the shipped pubkey verifies the download before it's applied.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx semantic-release

  # Publish the Windows .exe AFTER the release lands, publish-linux-repos-style:
  # build-nsis is continue-on-error and slow (cold-cache MSVC 15-25 min, a hang
  # runs to its 40-min timeout), so keeping it out of the release job's needs
  # means the signed macOS release never waits on it. The upload spends only the
  # workflow's own GITHUB_TOKEN — no environment gate needed.
  publish-windows:
    needs: [resolve-version, build-nsis, release]
    # Artifact presence, not build-nsis's continue-on-error result, determines
    # publication — same shape as publish-linux-repos.
    if: ${{ !cancelled() && needs.release.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Download the Windows build artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-nsis
          path: release-windows

      # release-build.sh's Linux version guard, Windows edition: resolve-version's
      # dry run SHOULD agree with the real semantic-release run (same commits, same
      # SHA), but if it doesn't, a mismatched .exe would be labelled with the wrong
      # version — worse than publishing none. Drop, don't fail: the release is
      # already out, and this is exactly the "Windows never blocks macOS" case.
      - name: Publish the .exe (version-guarded)
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh can't infer the repo from a git remote.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXE=release-windows/TMP-Companion-windows-alpha-x64-setup.exe
          if [ ! -f "$EXE" ]; then
            echo "publish-windows: no Windows artifact (build-nsis failed or was skipped) — nothing to publish"
            exit 0
          fi
          ARTIFACT_VERSION="$(cat release-windows/version.txt)"
          if [ "$ARTIFACT_VERSION" != "$VERSION" ]; then
            echo "publish-windows: WARNING artifact version ($ARTIFACT_VERSION) disagrees with this release ($VERSION) — dropping the .exe" >&2
            exit 0
          fi
          gh release upload "v$VERSION" "$EXE"

  publish-linux-repos:
    needs: [resolve-version, build-deb, build-rpm, release]
    # Artifact presence, not continue-on-error build results, determines publication.
    if: ${{ !cancelled() && needs.release.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read # artifact inventory through the REST API
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect available Linux artifacts
        id: available
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/select-linux-artifacts.sh >> "$GITHUB_OUTPUT"

      - name: Download .deb artifact (if any)
        if: steps.available.outputs.deb == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-deb
          path: incoming-deb

      - name: Download .rpm artifact (if any)
        if: steps.available.outputs.rpm == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-rpm
          path: incoming-rpm

      - name: Detect package artifacts before importing a key
        id: artifacts
        shell: bash
        env:
          EXPECTED_DEB: ${{ steps.available.outputs.deb }}
          EXPECTED_RPM: ${{ steps.available.outputs.rpm }}
        run: |
          deb=false rpm=false found=false
          for package in incoming-deb/*.deb; do
            if [ -f "$package" ]; then deb=true; fi
          done
          for package in incoming-rpm/*.rpm; do
            if [ -f "$package" ]; then rpm=true; fi
          done
          if [ "$EXPECTED_DEB" = true ] && [ "$deb" = false ]; then
            echo "linux-deb artifact contains no Debian package" >&2; exit 1
          fi
          if [ "$EXPECTED_RPM" = true ] && [ "$rpm" = false ]; then
            echo "linux-rpm artifact contains no RPM package" >&2; exit 1
          fi
          if [ "$deb" = true ] || [ "$rpm" = true ]; then found=true; fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Install repo-building tools
        if: steps.artifacts.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c gnupg rpm

      - name: Import the dedicated signing key
        if: steps.artifacts.outputs.found == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/linux-repo-key.XXXXXX")"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          keys="$(gpg --batch --list-secret-keys --with-colons)"
          test "$(printf '%s\n' "$keys" | awk -F: '$1 == "sec" { n++ } END { print n+0 }')" -eq 1
          FPR="$(printf '%s\n' "$keys" | awk -F: '$1 == "fpr" { print $10; exit }')"
          echo "FPR=$FPR" >> "$GITHUB_ENV"

      - name: Publish to the generated repository branch
        if: steps.artifacts.outputs.found == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: bash scripts/publish-linux-repos.sh incoming-deb incoming-rpm "$FPR" "$VERSION"

      - name: Remove the temporary signing key
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            gpgconf --homedir "$GNUPGHOME" --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi

  deploy-linux-repos:
    needs: publish-linux-repos
    # GITHUB_TOKEN pushes do not trigger another workflow. Deploy explicitly.
    if: ${{ !cancelled() && needs.publish-linux-repos.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
